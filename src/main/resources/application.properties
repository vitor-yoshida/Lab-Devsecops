# ===========================================================
#  Configuracao da aplicacao (Spring Boot)
#  Cada linha abaixo esta comentada para quem nunca viu Java.
# ===========================================================

# Nome que aparece nos logs
spring.application.name=app-vulneravel

# Porta onde o site vai responder: http://localhost:8080
server.port=8080

# ---- Banco de dados ----
# H2 "em memoria": o banco nasce junto com a aplicacao e morre quando
# ela para. Nao precisa instalar nada, perfeito para laboratorio.
spring.datasource.url=jdbc:h2:mem:labdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=SenhaSuperSecreta123

# Roda os arquivos schema.sql (cria a tabela) e data.sql (insere dados)
spring.sql.init.mode=always

# ---- Configuracoes INSEGURAS DE PROPOSITO ----
# Mostra a pilha de erro completa na tela do navegador.
# Em producao isso entrega a estrutura interna do sistema para o atacante.
server.error.include-message=always
server.error.include-stacktrace=always

# Console web do banco de dados aberto sem senha em /h2-console.
# Em producao isso e uma porta dos fundos para o banco inteiro.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
